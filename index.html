<!doctype html>
<html lang="zh-Hant">
<head>
<!-- 八關修正版：每關一種唯一目標，干擾植物數依序為 0–7；草地、恐龍及八張植物照片皆內嵌。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8f0d7">
<title>小新採草大冒險｜開放草地</title>
<style>
:root{color-scheme:light;--ink:#26342d;--muted:#6d786d;--cream:#f6f0df;--paper:#fffdf7;--green:#306344;--line:#d9dfcb;--shadow:0 14px 38px rgba(44,65,44,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 10% 0%,#fff9e9 0,transparent 38%),var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:clamp(10px,3vw,25px);padding-bottom:max(16px,env(safe-area-inset-bottom));overscroll-behavior:none}.app{width:min(900px,100%);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:45px;height:45px;border-radius:15px;background:#315d3c;color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 5px 12px #315d3c2c}.brand h1{margin:0;font-size:clamp(20px,5vw,29px);letter-spacing:.02em;line-height:1.1}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.pill{border:1px solid #dce1d0;background:#fffdf5;border-radius:999px;padding:8px 12px;font-weight:750;font-size:13px;white-space:nowrap}.panel{background:var(--paper);border:1px solid #e9e6d8;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.info{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px 18px 12px}.stage-progress{display:flex;align-items:center;gap:9px;margin-top:7px;color:#687365;font-size:11px;font-weight:750}.stage-track{width:min(150px,38vw);height:8px;border-radius:999px;background:#e4eadb;overflow:hidden}.stage-track i{display:block;width:12.5%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#78a65e,#315f3d);transition:width .25s ease}.level-name{font-size:18px;font-weight:850}.level-sub{font-size:12px;color:var(--muted);margin-top:3px}.goal{background:#f2f5e8;border:1px solid #e2e9d4;border-radius:14px;padding:8px 11px;text-align:center;min-width:98px}.goal strong{display:block;font-size:15px;color:#315d3c}.goal span{font-size:10px;color:var(--muted)}.plants{display:flex;gap:8px;align-items:center;overflow:auto;padding:0 16px 13px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.plant-chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border:1px solid #d9dfcb;background:#fff;border-radius:999px;font-size:12px;font-weight:700;color:#596458;transition:.18s}.plant-chip img{width:32px;height:32px;object-fit:cover;border-radius:50%;border:1px solid #eee7d4;background:#fff}.plant-chip.got{background:#eef5e5;border-color:#7aa273;color:#2e613b}.plant-chip.got::after{content:"✓";font-weight:900;color:#347347;margin-left:-3px}.board-wrap{position:relative;background:#b8d697;border-top:1px solid #e7ead9;overflow:hidden;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.board-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none;cursor:crosshair;outline:0}.board-wrap canvas.dragging{cursor:grabbing}.veil{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(23,39,28,.42);backdrop-filter:blur(3px);z-index:2}.veil[hidden]{display:none}.dialog{width:min(420px,100%);background:#fffdf7;border:1px solid #f2ead6;border-radius:22px;padding:23px 22px 20px;text-align:center;box-shadow:0 18px 50px #10201540;animation:pop .22s ease-out}.dialog .emoji{font-size:39px;line-height:1}.dialog h2{font-size:24px;margin:10px 0 7px}.dialog p{color:#697468;font-size:14px;line-height:1.65;margin:0 auto 17px;max-width:350px}.action{appearance:none;border:0;border-radius:14px;background:#315f3d;color:white;padding:12px 22px;font:inherit;font-size:15px;font-weight:850;box-shadow:0 5px 0 #20462b;cursor:pointer;touch-action:manipulation}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #20462b}.hintbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px 13px;background:#fffdf7;color:#697468;font-size:12px}.hint{display:flex;align-items:center;gap:7px}.hint b{color:#345c3b}.keys{font-size:11px;color:#758071;text-align:right}.mobile-note{display:none}.footer{padding:12px 4px 0;color:#788174;font-size:11px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}
.target-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 16px 12px;padding:10px 13px;background:#fff7d8;border:2px solid #e8c966;border-radius:16px}.target-main{display:flex;align-items:center;gap:12px;min-width:0}.target-images{display:flex;align-items:center;gap:4px;flex:none}.target-images img{width:58px;height:58px;object-fit:cover;border-radius:13px;border:2px solid #fff;box-shadow:0 2px 8px #6d5c2530;background:#fff;flex:none}.target-images.multi img{width:36px;height:36px;border-radius:10px}.target-name.multiple{font-size:clamp(15px,3.5vw,19px);line-height:1.35}.target-copy{min-width:0}.target-kicker{font-size:11px;font-weight:800;color:#7b6720;letter-spacing:.04em}.target-name{display:block;font-size:clamp(20px,4.5vw,25px);line-height:1.2;color:#315d3c;font-weight:950;margin:2px 0}.target-help{font-size:11px;color:#665e45}.voice-btn{appearance:none;flex:none;border:1px solid #bdc99f;border-radius:12px;background:#fffdf7;color:#315d3c;padding:9px 11px;font:inherit;font-size:12px;font-weight:850;cursor:pointer;touch-action:manipulation}.voice-btn:active{transform:scale(.97)}.voice-status{font-size:10px;color:#697468;min-height:1em;text-align:right}.plant-chip.target-chip{background:#fff3bd;border:2px solid #d2a927;color:#4c451e}.plant-chip.target-chip::before{content:"目標";font-size:9px;color:#715900;background:#ffe28a;border-radius:6px;padding:2px 4px}.plant-chip.got{background:#eef5e5;border-color:#7aa273;color:#2e613b}.toast{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 15px;border-radius:14px;background:#fffdf3;color:#304332;border:2px solid #d8c45b;box-shadow:0 5px 18px #20351f45;font-size:14px;font-weight:850;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}.toast.show{opacity:1}.toast.wrong{border-color:#e6a064;background:#fff3e7;color:#754329}.toast[hidden]{display:none}@media(max-width:560px){.target-card{margin:0 11px 10px;padding:8px 10px}.target-main img{width:49px;height:49px}.target-help{font-size:10px}.voice-btn{padding:8px 9px;font-size:11px}.toast{font-size:13px;top:8px}}
@media(max-width:560px){body{padding:10px 10px max(14px,env(safe-area-inset-bottom))}.topbar{margin-bottom:10px}.brand-mark{width:40px;height:40px;border-radius:13px}.pill{padding:7px 9px;font-size:11px}.panel{border-radius:18px}.info{padding:12px 13px 10px}.plants{padding:0 11px 11px;gap:6px}.plant-chip{font-size:11px;padding-right:8px}.plant-chip img{width:28px;height:28px}.hintbar{padding:10px 12px}.keys{display:none}.mobile-note{display:inline}.dialog{padding:20px 16px 18px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">🌿</div><div><h1>小新採草大冒險</h1><p>在開放草地找藥草、躲開恐龍！</p></div></div>
    <div class="pill" id="levelPill">第 1 關・簡單</div>
  </header>
  <section class="panel" aria-label="開放草地遊戲">
    <div class="info"><div><div class="level-name" id="levelTitle">第 1 關｜簡單</div><div class="level-sub" id="levelDesc">找到指定植物，再帶小新前往出口。</div><div class="stage-progress"><span id="stageProgressText">關卡進度 1 / 8</span><div class="stage-track" id="stageProgressTrack" role="progressbar" aria-label="八關遊戲進度" aria-valuemin="0" aria-valuemax="8" aria-valuenow="1"><i id="stageProgressFill"></i></div></div></div><div class="goal"><strong id="countText">目標 0/1 種</strong><span>目標植物進度</span></div></div>
    <div class="target-card" aria-live="polite"><div class="target-main"><div class="target-images" id="targetImages" aria-hidden="true"></div><div class="target-copy"><div class="target-kicker">本關指定目標</div><strong class="target-name" id="targetName">迷迭香</strong><div class="target-help" id="targetHelp">找到目標植物，再走到出口！</div></div></div><div><button class="voice-btn" id="voiceButton" type="button" aria-label="重聽植物名稱和指示">🔊 重聽</button><div class="voice-status" id="voiceStatus" aria-live="polite"></div></div></div>
    <div class="plants" id="plantTray" aria-label="本關會出現的植物；金色標記為本關目標"></div>
    <div class="board-wrap" id="boardWrap">
      <canvas id="game" aria-label="小新在開放草地尋找本關指定植物並躲避恐龍"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div><div class="veil" id="veil"><div class="dialog"><div class="emoji" id="dialogEmoji">🌿</div><h2 id="dialogTitle">準備出發！</h2><p id="dialogText">八關依序尋找不同植物；每關找到指定植物，再帶小新前往出口。直接拖曳或點按草地移動，也可使用方向鍵或 WASD。恐龍會慢慢追來，記得持續移動喔！</p><button class="action" id="dialogButton" type="button">開始冒險</button></div></div>
    </div>
    <div class="hintbar"><div class="hint"><span>☝️</span><span><b>點按或拖曳草地移動</b><span class="mobile-note">，跟手靈敏</span><span class="keys">｜滑鼠亦可</span></span></div><div class="keys">鍵盤：方向鍵 / WASD　·　找到指定植物後走到出口</div></div>
  </section>
  <div class="footer">草地沒有迷宮；完成八關、每關找出指定植物，再躲開恐龍前往右側出口。</div>
</main>

function loop(now){if(state!=="running")return;const dt=Math.min(.04,(now-lastFrame)/1000||0);lastFrame=now;let dx=0,dy=0;for(const k of keys){if(k==="ArrowLeft"||k.toLowerCase()==="a")dx--;if(k==="ArrowRight"||k.toLowerCase()==="d")dx++;if(k==="ArrowUp"||k.toLowerCase()==="w")dy--;if(k==="ArrowDown"||k.toLowerCase()==="s")dy++}if(dx||dy){pointerTarget=null;movePlayer(dx,dy,dt)}else if(pointerTarget){const vx=pointerTarget.x-player.x,vy=pointerTarget.y-player.y,dist=Math.hypot(vx,vy);if(dist>3)movePlayer(vx,vy,dt);else pointerTarget=null}moveDino(dt);if(Math.hypot(player.x-dino.x,player.y-dino.y)<PLAYER_R+16)caught();else checkExit();draw();if(state==="running")requestAnimationFrame(loop)}

function drawGrass(){ctx.fillStyle="#add08a";ctx.fillRect(0,0,FIELD_W,FIELD_H);for(let i=0;i<260;i++){const x=(i*127+31)%FIELD_W,y=(i*211+17)%FIELD_H;ctx.strokeStyle=i%3===0?"#8dbd71":"#9fc77e";ctx.globalAlpha=.58;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x+2,y-3,x+4,y-6);ctx.stroke();if(i%29===0){ctx.fillStyle="#fff8df";ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(x+5,y-4,2.2,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.strokeStyle="#85b36b";ctx.lineWidth=10;ctx.strokeRect(4,4,FIELD_W-8,FIELD_H-8);ctx.strokeStyle="#c9dfa9";ctx.lineWidth=2;ctx.strokeRect(10,10,FIELD_W-20,FIELD_H-20)}
function drawExit(){const open=collected===LEVELS[levelIndex].targets.length,x=exit.x,y=exit.y;ctx.save();ctx.translate(x,y);ctx.fillStyle="#354a30";ctx.beginPath();ctx.ellipse(0,24,37,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=open?"#3e7746":"#80624a";rr(ctx,-25,-31,50,60,7);ctx.fill();ctx.fillStyle=open?"#d7e8a2":"#e0cb88";rr(ctx,-18,-25,36,48,4);ctx.fill();ctx.fillStyle=open?"#376548":"#805e43";ctx.beginPath();ctx.arc(9,0,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#244b2e";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(open?"出口":"🔒",0,-40);ctx.font="bold 15px system-ui";ctx.fillText("▲",0,-67);if(open){ctx.globalAlpha=.28+Math.sin(performance.now()/240)*.12;ctx.strokeStyle="#f7ffb6";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawHerb(item){const x=item.x,y=item.y;ctx.save();ctx.shadowColor="#30472c44";ctx.shadowBlur=8;ctx.fillStyle="#fffdf3";ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(x,y,21,0,Math.PI*2);ctx.clip();const img=images[item.herbIdx];if(img.complete&&img.naturalWidth)ctx.drawImage(img,x-21,y-21,42,42);else{ctx.fillStyle="#fff";ctx.fillRect(x-21,y-21,42,42)}ctx.restore();ctx.save();ctx.fillStyle="#fffdf0";ctx.strokeStyle="#79965e";ctx.lineWidth=1.5;rr(ctx,x-43,y+24,86,22,9);ctx.fill();ctx.stroke();ctx.fillStyle="#304332";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(HERBS[item.herbIdx].name,x,y+35);ctx.restore()}
function drawPlayer(){const x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.fillStyle="#26332e33";ctx.beginPath();ctx.ellipse(0,20,20,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f4c648";rr(ctx,-15,1,30,19,5);ctx.fill();ctx.fillStyle="#dc4f3f";rr(ctx,-17,-14,34,20,6);ctx.fill();ctx.fillStyle="#f5c39b";ctx.beginPath();ctx.ellipse(0,-17,16,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#171918";ctx.beginPath();ctx.moveTo(-15,-19);ctx.lineTo(-17,-25);ctx.lineTo(-12,-23);ctx.lineTo(-9,-30);ctx.lineTo(-5,-25);ctx.lineTo(-1,-33);ctx.lineTo(3,-25);ctx.lineTo(8,-31);ctx.lineTo(11,-24);ctx.lineTo(16,-27);ctx.lineTo(15,-19);ctx.quadraticCurveTo(11,-21,8,-19);ctx.lineTo(4,-22);ctx.lineTo(0,-19);ctx.lineTo(-4,-22);ctx.lineTo(-9,-19);ctx.lineTo(-12,-21);ctx.closePath();ctx.fill();
// 明顯的黑色頭頂髮髻／髮束，確保小新不會看起來像禿頭。
ctx.beginPath();ctx.ellipse(0,-30,5.2,4.2,-.08,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.moveTo(-3.5,-30);ctx.lineTo(-2,-37);ctx.lineTo(1,-33);ctx.lineTo(4,-39);ctx.lineTo(5.2,-30);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(-15,-21);ctx.quadraticCurveTo(-19,-17,-14,-11);ctx.lineTo(-11,-15);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(15,-21);ctx.quadraticCurveTo(19,-17,14,-11);ctx.lineTo(11,-15);ctx.closePath();ctx.fill();ctx.fillStyle="#20221f";ctx.beginPath();ctx.arc(-5,-16,1.8,0,Math.PI*2);ctx.arc(5,-16,1.8,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#934c39";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-12,4,.2,Math.PI-.2);ctx.stroke();ctx.restore()}
function drawDino(){const x=dino.x,y=dino.y,r=24;ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(dino.faceY,dino.faceX));ctx.fillStyle="#25342a30";ctx.beginPath();ctx.ellipse(0,19,29,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#4d944c";ctx.beginPath();ctx.ellipse(-2,0,25,17,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-17,-8);ctx.lineTo(-32,-16);ctx.lineTo(-23,-1);ctx.fill();ctx.beginPath();ctx.ellipse(14,-8,14,12,-.12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-14,-22);ctx.lineTo(0,-14);ctx.fill();ctx.fillStyle="#f1d984";ctx.beginPath();ctx.arc(20,-11,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#17241a";ctx.beginPath();ctx.arc(21,-11,1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e97458";ctx.beginPath();ctx.ellipse(23,-2,9,3,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,FIELD_W,FIELD_H);drawGrass();drawExit();for(const item of items)if(!item.got)drawHerb(item);drawDino();drawPlayer()}
function canvasPoint(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*FIELD_W/rect.width,y:(e.clientY-rect.top)*FIELD_H/rect.height}}
canvas.addEventListener("pointerdown",e=>{if(state!=="running")return;e.preventDefault();const p=canvasPoint(e),near=Math.hypot(p.x-player.x,p.y-player.y)<64;drag={id:e.pointerId,offsetX:near?player.x-p.x:0,offsetY:near?player.y-p.y:0};pointerTarget={x:clamp(p.x+drag.offsetX,PLAYER_R+5,FIELD_W-PLAYER_R-5),y:clamp(p.y+drag.offsetY,PLAYER_R+5,FIELD_H-PLAYER_R-5)};canvas.classList.add("dragging");try{canvas.setPointerCapture(e.pointerId)}catch(_){}draw()},{passive:false});
canvas.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();const p=canvasPoint(e);pointerTarget={x:clamp(p.x+drag.offsetX,PLAYER_R+5,FIELD_W-PLAYER_R-5),y:clamp(p.y+drag.offsetY,PLAYER_R+5,FIELD_H-PLAYER_R-5)}},{passive:false});
function endDrag(e){if(drag&&(!e||drag.id===e.pointerId)){drag=null;canvas.classList.remove("dragging")}}canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);canvas.addEventListener("lostpointercapture",endDrag);canvas.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key===" "){if(state==="ready")beginGame();return}keys.add(e.key)});window.addEventListener("keyup",e=>keys.delete(e.key));window.addEventListener("blur",()=>{keys.clear();endDrag()});window.addEventListener("resize",resizeCanvas);dialogButton.addEventListener("click",()=>action());document.getElementById("voiceButton").addEventListener("click",speakTarget);
setupLevel();
</script>
